<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <nav id="links-container">
      <a href="#">Gmail</a>
      <a href="#">Unsplash</a>
      <a href="#">My site</a>
      <a href="#">About</a>
    </nav>

    <div class="hero-section">
      <div class="atom">
        <div class="electron-alpha"></div>
        <div class="electron-omega"></div>
      </div>
      
      <div class="social-buttons">
        <a href="#" class="social-button social-button--instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-button social-button--youtube"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" class="social-button social-button--facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="social-button social-button--linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#" class="social-button social-button--snapchat"><i class="fa-brands fa-snapchat"></i></a>
        <a href="#" class="social-button social-button--github"><i class="fa-brands fa-github"></i></a>
        <a href="#" class="social-button social-button--codepen"><i class="fa-brands fa-codepen"></i></a>
      </div>
    </div>

    <div id="search-container">
      <div id="search-input-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
        <input type="text" placeholder="Search anything" id="search-input">
      </div>
      <button class="search-btn"><i class="fa fa-search"></i></button>
      <button class="mic-btn"><i class="fa fa-microphone"></i></button>
    </div>

    <div id="apps-container">
      <a href="#">
        <i class="fa-brands fa-stack-overflow"></i>
        <div class="label"><span class="name">Stack Overflow</span><span class="url">stackoverflow.com</span></div>
      </a>
      <a href="#">
        <i class="fa-brands fa-github"></i>
        <div class="label"><span class="name">Github</span><span class="url">github.com</span></div>
      </a>
      <a href="#">
        <i class="fa-solid fa-robot"></i>
        <div class="label"><span class="name">Chat GPT</span><span class="url">chat.openai.com</span></div>
      </a>
      <a href="#">
        <i class="fa-brands fa-codepen"></i>
        <div class="label"><span class="name">CodePen</span><span class="url">codepen.io</span></div>
      </a>
      <a href="#">
        <i class="fa-brands fa-youtube"></i>
        <div class="label"><span class="name">YouTube</span><span class="url">youtube.com</span></div>
      </a>
      <a href="#">
        <i class="fa-brands fa-spotify"></i>
        <div class="label"><span class="name">Spotify</span><span class="url">spotify.com</span></div>
      </a>
    </div>

    <div class="footer-text">
      <h3 class="txt-ne" data-text="Coding is Love ❤️">Coding is Love ❤️</h3>
    </div>
  </main>

</body>
</html>
