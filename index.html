<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon UI Phone Concept</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h3 class="txt-by" data-text="Created By">Created By</h3>
  <h3 class="txt-ne" data-text="Neon Design">Neon Design</h3>

  <div id="phone">
    <div id="main-wrapper" class="fancy-scrollbar">
      <div id="main">
        <div id="content">
          
          <div id="header-container">
            <div id="logo">
              <h2>My Device</h2>
            </div>
            <button id="user-menu-button">
              <img src="https://via.placeholder.com/40" alt="User">
            </button>
          </div>

          <div id="links-container" style="margin-top: 1rem;">
            <a href="#">Home</a>
            <a href="#">Widgets</a>
            <a href="#">Settings</a>
          </div>

          <div id="search-container">
            <div id="search-input-container">
              <i class="fa fa-search" style="color: rgba(255,255,255,0.5);"></i>
              <input type="text" placeholder="Search...">
            </div>
            <button id="image-button"><i class="fa fa-camera"></i></button>
          </div>

          <div id="apps-container">
            <a href="#">
              <i class="fa-brands fa-chrome"></i>
              <div class="label">
                <span class="name">Browser</span>
                <span class="url">web</span>
              </div>
            </a>
            <a href="#">
              <i class="fa-brands fa-youtube"></i>
              <div class="label">
                <span class="name">Video</span>
                <span class="url">media</span>
              </div>
            </a>
            <a href="#">
              <i class="fa-brands fa-spotify"></i>
              <div class="label">
                <span class="name">Music</span>
                <span class="url">audio</span>
              </div>
            </a>
            <a href="#">
              <i class="fa-brands fa-twitter"></i>
              <div class="label">
                <span class="name">Social</span>
                <span class="url">feed</span>
              </div>
            </a>
          </div>

          <div class="searchContainer">
            <div class="box">
              <h4 style="color: #333;">Module 1</h4>
              <p style="color: #666; font-size: 0.8rem; margin-top: 0.5rem;">Content goes here.</p>
            </div>
            <div class="box">
              <h4 style="color: #333;">Module 2</h4>
              <p style="color: #666; font-size: 0.8rem; margin-top: 0.5rem;">Content goes here.</p>
            </div>
          </div>

          <div style="display: flex; justify-content: center; margin: 4rem 0;">
            <div class="atom">
              <div class="electron-alpha"></div>
              <div class="electron-omega"></div>
            </div>
          </div>

          <div class="social-buttons" style="justify-content: center; margin-top: 2rem;">
            <a href="#" class="social-button social-button--facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="social-button social-button--twitter"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="social-button social-button--instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-button social-button--github"><i class="fa-brands fa-github"></i></a>
          </div>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
