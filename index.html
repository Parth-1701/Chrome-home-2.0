<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css?family=Pacifico');
    
    :root {
      --body-color: 48 48 58;
      --font-color: 255 255 255;
      --highlight-color: 0 0 0;
      --theme-background: 32 33 36; /* Adjusted to match your screenshot's dark grey */
      
      --theme-light: 0 0 0;
      --theme-medium: 0 0 0;
      --theme-dark: 0 0 0;
      
      --atom-size: 180px;
      --atom-color-hex: #00d8ff;
      --atom-color-rgb: 0, 216, 255;
      --nucleus-size: calc(var(--atom-size) / 5);
      --electron-color-hex: #99f8ff;
      --electron-size : calc(var(--atom-size) / 25);
      --electron-orbit-size : calc(var(--atom-size) / 2.5);
      --electron-speed : 1.2s;
      --electron-speed-alpha : 1s;
      --electron-speed-omega : .8s;
    }

    body {
      background-color: rgb(var(--body-color));
      margin: 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background-color: rgb(var(--theme-background)); }
    body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }

    * { box-sizing: border-box; }

    h1, h2, h3, h4, input, select, button, span, a, p {
      color: rgb(var(--font-color));
      font-family: "Noto Sans", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      margin: 0px;
    }

    button, a, input { outline: none; }

    .fancy-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
    .fancy-scrollbar::-webkit-scrollbar-track { background-color: transparent; }
    .fancy-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }

    /* Main Phone Container */
    #phone {
      background-color: rgb(var(--theme-background));
      box-shadow: rgba(0, 0, 0, 0.2) 0px 8px 24px;
      height: 851px;
      width: 393px;  
      position: relative;
      overflow: hidden;
      border-radius: 20px; /* Added slight rounding for desktop view */
    }

    #main-wrapper {
      height: 100%;
      overflow: auto;
    }

    #main { height: 100%; }
    #content { padding: 1.5rem; }

    /* Top Links */
    #links-container {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    #links-container > a {
      color: rgb(255 255 255 / 80%);
      font-size: 0.75rem;
      text-decoration: none;
    }
    #links-container > a:is(:hover, :focus) { text-decoration: underline; }

    /* Atom Animation (Centered) */
    .atom-wrapper {
      display: flex;
      justify-content: center;
      margin: 40px 0;
    }

    /* Social Buttons */
    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 2rem;
    }
    .social-button {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 35px;
      height: 35px;
      text-decoration: none;
      border-radius: 100%;
      background: #fff;
      color: #333;
      transition: 0.3s;
    }
    .social-button i { font-size: 18px; }

    .social-button--instagram { color: #e4405f; }
    .social-button--youtube { color: #ff0000; }
    .social-button--facebook { color: #3b5999; }
    .social-button--linkedin { color: #0077b5; }
    .social-button--snapchat { color: #eec900; }
    .social-button--github { color: #212121; }
    .social-button--codepen { color: #212121; }

    /* Search Bar */
    #search-container {
      display: flex;
      gap: 0.2rem;
      margin-top: 0.2rem;
    }
    #search-input-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: rgb(255 255 255 / 10%);
      padding-left: 1rem;
      border-radius: 0.2rem;
      border-bottom-left-radius: 0.5rem;
      border-top-left-radius: 0.5rem;
      flex-grow: 1;
    }
    #search-input-container > img { height: 1.2rem; }
    #search-input-container > input {
      width: 100%;
      height: 3.25rem;
      background-color: transparent;
      padding: 1rem 0;
      border: none;
      color: rgb(255 255 255 / 80%);
    }
    #search-container > button {
      background-color: rgb(255 255 255 / 10%);
      color: rgb(255 255 255 / 80%);
      font-size: 1rem;
      border: none;
      width: 3.5rem;
      border-radius: 0.2rem;
      cursor: pointer;
    }
    #search-container > #image-button { border-bottom-right-radius: 0.5rem; border-top-right-radius: 0.5rem; }

    /* Apps Grid */
    #apps-container {
      display: grid;
      gap: 0.3rem;
      grid-template-columns: repeat(2, 1fr);  
      margin: 2rem 0rem;
    }
    #apps-container > a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: rgb(255 255 255 / 10%);
      padding: 1rem 0.75rem;
      border-radius: 0.4rem;
      text-decoration: none;
    }
    #apps-container > a > i {
      height: 2rem; 
      width: 2rem; 
      flex-shrink: 0;
      font-size: 1.5rem;
      line-height: 2rem; 
      text-align: center;
    }
    #apps-container > a > .label {
      width: calc(100% - 2.5rem);
      display: flex;
      flex-direction: column;
      align-self: flex-start;
      overflow: hidden;
    }
    #apps-container > a > .label > :is(.name, .url) {
      width: 100%;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    #apps-container > a > .label > .name { font-size: 0.8rem; }
    #apps-container > a > .label > .url { font-size: 0.65rem; color: rgb(255 255 255 / 50%); }

    /* App Icon Colors (Matching your CSS) */
    #apps-container > a:nth-child(1) { color: #f48024; } /* Stack Overflow */
    #apps-container > a:nth-child(2) { color: rgb(255, 0, 0); } /* Github (red in your css) */
    #apps-container > a:nth-child(3) { color: rgb(28, 204, 91); } /* ChatGPT */
    #apps-container > a:nth-child(4) { color: rgb(28, 147, 228); } /* CodePen */
    #apps-container > a:nth-child(5) { color: rgb(242, 85, 90); } /* YouTube */
    #apps-container > a:nth-child(6) { color: #1db954; } /* Spotify */
    #apps-container > a:nth-child(7) { color: #e50914; } /* Netflix */
    #apps-container > a:nth-child(8) { color: rgb(15, 118, 14); } /* Xbox */

    /* Atom CSS Animations */
    .atom {
      position: relative;
      width: var(--atom-size);
      height: var(--atom-size);
      animation: 8s atom infinite cubic-bezier(1, .25, 0, .75);
    }
    @keyframes atom {
      0% { transform: rotate(0deg) scale(1); }
      12.5% { transform: rotate(-45deg) scale(.9); }
      25% { transform: rotate(-90deg) scale(1); }
      37.5% { transform: rotate(-135deg) scale(.9); }
      50% { transform: rotate(-180deg) scale(1); }
      62.5% { transform: rotate(-225deg) scale(.9); }
      75% { transform: rotate(-270deg) scale(1); }
      87.5% { transform: rotate(-315deg) scale(.9); }
      100% { transform: rotate(-360deg) scale(1); }
    }
    .atom::before {
      content: '';
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--nucleus-size);
      height: var(--nucleus-size);
      margin-top: calc(var(--nucleus-size) / -2);
      margin-left: calc(var(--nucleus-size) / -2);
      background: var(--electron-color-hex);
      border-radius: 100%;
      box-shadow: 0 0 3px 0 var(--atom-color-hex);
      animation: 2s nucleus infinite cubic-bezier(.65, 0, .35, 1);
    }
    @keyframes nucleus {
      0%, 50%, 100% { transform: scale(1); }
      25% { transform: scale(.9); }
      75% { transform: scale(.85); }
    }
    .atom > [class^="electron"] {
      border-top: solid rgba(var(--atom-color-rgb), .5) 1px;
      border-right: solid rgba(var(--atom-color-rgb), .35) 2px;
      border-bottom: solid rgba(var(--atom-color-rgb), .2) 4px;
      border-left: solid rgba(var(--atom-color-rgb), 0) 2px;
      border-radius: 100%;
      width: 100%;
      height: var(--electron-orbit-size);
      position: absolute;
      top: 50%;
      margin-top: calc(var(--electron-orbit-size) / -2);
      animation: var(--electron-speed) electron-orbit infinite linear;
    }
    .atom > .electron-alpha { transform: rotate(60deg); animation: var(--electron-speed-alpha) electron-orbit infinite linear; }
    .atom > .electron-omega { transform: rotate(-60deg); animation: var(--electron-speed-omega) electron-orbit infinite linear; }

    @keyframes electron-orbit {
      0%, 100% { border-top: solid rgba(var(--atom-color-rgb), .5) 1px; border-right: solid rgba(var(--atom-color-rgb), .35) 2px; border-bottom: solid rgba(var(--atom-color-rgb), .2) 4px; border-left: solid rgba(var(--atom-color-rgb), 0) 2px; }
      25% { border-top: solid rgba(var(--atom-color-rgb), .35) 1px; border-right: solid rgba(var(--atom-color-rgb), .2) 2px; border-bottom: solid rgba(var(--atom-color-rgb), 0) 4px; border-left: solid rgba(var(--atom-color-rgb), .5) 2px; }
      50% { border-top: solid rgba(var(--atom-color-rgb), .2) 1px; border-right: solid rgba(var(--atom-color-rgb), 0) 2px; border-bottom: solid rgba(var(--atom-color-rgb), .5) 4px; border-left: solid rgba(var(--atom-color-rgb), .35) 2px; }
      75% { border-top: solid rgba(var(--atom-color-rgb), 0) 1px; border-right: solid rgba(var(--atom-color-rgb), .5) 2px; border-bottom: solid rgba(var(--atom-color-rgb), .35) 4px; border-left: solid rgba(var(--atom-color-rgb), .2) 2px; }
    }
    .atom [class^="electron"]::after {
      content: '';
      display: block;
      width: var(--electron-size);
      height: var(--electron-size);
      background: var(--electron-color-hex);
      border-radius: 50%;
      margin-top: calc(var(--electron-size) / -2);
      position: absolute;
      top: 50%;
      left: calc(var(--electron-size) / -1);
      transform: scale(1);
      animation: calc(var(--electron-speed) * 2) electron infinite ease-in-out;
    }
    .atom .electron-alpha::after { animation: calc(var(--electron-speed-alpha) * 2) electron infinite ease-in-out; }
    .atom .electron-omega::after { animation: calc(var(--electron-speed-omega) * 2) electron infinite ease-in-out; }

    @keyframes electron {
      0%, 50%, 100% { left: calc(var(--electron-size) / -1); transform: scale(1); }
      12.5%, 62.5% { top: 100%; transform: scale(1.5); }
      25%, 75% { left: 100%; transform: scale(1); }
      37.5%, 87.5% { top: 0%; transform: scale(.25); }
    }

    /* Mobile Browser Override */
    @media(max-width: 500px) {
      body { overflow: auto; background-color: rgb(var(--theme-background)); }
      #phone { height: 100vh; display: flex; width: 100%; margin: 0px auto; border-radius: 0; box-shadow: none; }
      #main-wrapper { width: 100%; flex-grow: 1; }
    }
  </style>
</head>
<body>

  <div id="phone">
    <div id="main-wrapper" class="fancy-scrollbar">
      <div id="main">
        <div id="content">

          <div id="links-container">
            <a href="https://mail.google.com">Gmail</a>
            <a href="#">Unsplash</a>
            <a href="https://quizable.online/">My site</a>
            <a href="#">About</a>
          </div>

          <div class="atom-wrapper">
            <div class="atom">
              <div class="electron"></div>
              <div class="electron-alpha"></div>
              <div class="electron-omega"></div>
            </div>
          </div>

          <div class="social-buttons">
            <a href="#" class="social-button social-button--instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com" class="social-button social-button--youtube"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-button social-button--facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-button social-button--linkedin"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="social-button social-button--snapchat"><i class="fab fa-snapchat-ghost"></i></a>
            <a href="https://github.com/Parth-1701" class="social-button social-button--github"><i class="fab fa-github"></i></a>
            <a href="codepen.io" class="social-button social-button--codepen"><i class="fa-solid fa-cube"></i></a>
          </div>

          <form id="search-container" action="https://www.google.com/search" method="GET">
  <div id="search-input-container">
    <img src="https://iili.io/CfYPPcv.png" alt="Google Logo" />
    <input type="text" name="q" placeholder="Search anything" required />
  </div>
  <button type="submit"><i class="fas fa-search"></i></button>
  <button type="button" id="image-button"><i class="fas fa-microphone"></i></button>
</form>


          <div id="apps-container">
            <a href="#">
              <i class="fab fa-stack-overflow"></i>
              <div class="label"><span class="name">Stack Overflow</span><span class="url">stackoverflow.com</span></div>
            </a>
            <a href="https://github.com/Parth-1701/Final">
              <i class="fab fa-github"></i>
              <div class="label"><span class="name">Github</span><span class="url">github.com</span></div>
            </a>
            <a href="https://chatgpt.com">
              <i class="fas fa-robot"></i>
              <div class="label"><span class="name">Chat GPT</span><span class="url">chat.openai.com</span></div>
            </a>
            <a href="#">
              <i class="fab fa-codepen"></i>
              <div class="label"><span class="name">CodePen</span><span class="url">codepen.io</span></div>
            </a>
            <a href="#">
              <i class="fab fa-youtube"></i>
              <div class="label"><span class="name">YouTube</span><span class="url">youtube.com</span></div>
            </a>
            <a href="#">
              <i class="fab fa-spotify"></i>
              <div class="label"><span class="name">Spotify</span><span class="url">spotify.com</span></div>
            </a>
            <a href="#">
              <i class="fas fa-play"></i>
              <div class="label"><span class="name">Netflix</span><span class="url">netflix.com</span></div>
            </a>
            <a href="#">
              <i class="fab fa-xbox"></i>
              <div class="label"><span class="name">Xbox</span><span class="url">xbox.com</span></div>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchForm = document.getElementById('search-container');
      const searchInput = searchForm.querySelector('input[name="q"]');
      const micButton = document.getElementById('image-button');
      const micIcon = micButton.querySelector('i');

      // Check if the browser supports the Web Speech API (Chrome, Edge, Safari)
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        
        // Settings: only listen for one phrase and stop
        recognition.continuous = false; 
        recognition.interimResults = false; 

        // When the mic button is clicked, start listening
        micButton.addEventListener('click', () => {
          recognition.start();
          micIcon.style.color = '#ff4444'; // Turn icon red to show it's recording
          searchInput.placeholder = 'Listening...';
        });

        // When the browser successfully translates the speech to text
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          
          // Put the spoken words into the search box
          searchInput.value = transcript;
          
          // Submit the search form automatically
          searchForm.submit();
        };

        // Reset the UI when it stops listening (whether successful or not)
        recognition.onend = () => {
          micIcon.style.color = ''; 
          searchInput.placeholder = 'Search anything';
        };

        // Handle errors (like if the user denies microphone permission)
        recognition.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          searchInput.placeholder = 'Mic error. Try typing.';
        };

      } else {
        // If the browser doesn't support voice search (like older Firefox)
        micButton.addEventListener('click', () => {
          alert("Sorry, your browser doesn't support voice search.");
        });
      }
    });
  </script>
</body>
</html>

</body>
</html>
